<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phone Book Application</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 h-full flex flex-col">

    <header class="bg-indigo-600 text-white shadow-md sticky top-0 z-20">
        <div class="max-w-4xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="bg-white/10 p-2.5 rounded-xl text-2xl">
                    <i class="fa-solid fa-address-book"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-tight">Phone Book</h1>
                    <p class="text-xs text-indigo-200">Manage your contacts securely and easily</p>
                </div>
            </div>
            <button onclick="openAddModal()" class="w-full sm:w-auto bg-white text-indigo-600 font-semibold px-5 py-2.5 rounded-xl shadow-sm hover:bg-indigo-50 transition active:scale-95 flex items-center justify-center gap-2">
                <i class="fa-solid fa-user-plus"></i> Add New Contact
            </button>
        </div>
    </header>

    <main class="flex-grow max-w-4xl w-full mx-auto px-4 py-6 flex flex-col gap-6">
        <!-- Toast Notification Area -->
        <div id="toast" class="hidden fixed top-20 right-4 z-50 px-4 py-3 rounded-xl shadow-lg text-white font-medium text-sm transition-all transform duration-300 translate-y-[-10px] flex items-center gap-3">
            <span id="toast-icon"></span>
            <span id="toast-message"></span>
        </div>

        <!-- Search & Filter Bar -->
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex flex-col sm:flex-row gap-3 items-center justify-between">
            <div class="relative w-full sm:w-96">
                <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </span>
                <input type="text" id="searchInput" oninput="handleSearch()" placeholder="Search by name or phone number..." 
                    class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition">
            </div>
            <div class="flex items-center justify-between w-full sm:w-auto gap-4 text-sm text-slate-500 font-medium">
                <span id="contactCount">0 contacts saved</span>
                <div class="flex bg-slate-100 p-1 rounded-xl">
                    <button onclick="setViewMode('list')" id="listViewBtn" class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-white text-indigo-600 shadow-sm transition">
                        <i class="fa-solid fa-list"></i>
                    </button>
                    <button onclick="setViewMode('grid')" id="gridViewBtn" class="px-3 py-1.5 rounded-lg text-xs font-semibold text-slate-500 hover:text-slate-800 transition">
                        <i class="fa-solid fa-grip"></i>
                    </button>
                </div>
            </div>
        </div>

        <div id="contactContainer" class="flex-grow">
            <!-- Dynamically populated contacts -->
        </div>
    </main>

    <!-- Add/Edit Contact Modal -->
    <div id="contactModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-md rounded-2xl shadow-xl overflow-hidden transform transition-all">
            <div class="px-6 py-4 bg-slate-50 border-b border-slate-100 flex justify-between items-center">
                <h3 id="modalTitle" class="font-bold text-lg text-slate-800">Add Contact</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 p-1 rounded-lg transition">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            <form id="contactForm" onsubmit="handleFormSubmit(event)" class="p-6 flex flex-col gap-4">
                <input type="hidden" id="contactId">
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-500 mb-1.5">Full Name *</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400"><i class="fa-solid fa-user"></i></span>
                        <input type="text" id="nameInput" required placeholder="e.g. Jane Doe" 
                            class="w-full pl-10 pr-4 py-2.5 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-500 mb-1.5">Phone Number *</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400"><i class="fa-solid fa-phone"></i></span>
                        <input type="text" id="phoneInput" required placeholder="e.g. +1 (555) 019-2834 or any text" 
                            class="w-full pl-10 pr-4 py-2.5 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                    <p class="text-[11px] text-slate-400 mt-1">Any format or custom number is accepted</p>
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-500 mb-1.5">Category / Group</label>
                    <select id="categoryInput" class="w-full px-3 py-2.5 border border-slate-200 rounded-xl text-sm bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
                        <option value="Personal">Personal</option>
                        <option value="Work">Work</option>
                        <option value="Family">Family</option>
                        <option value="Friends">Friends</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div class="flex justify-end gap-3 mt-4 pt-4 border-t border-slate-100">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl border border-slate-200 text-slate-600 font-medium text-sm hover:bg-slate-50 transition">Cancel</button>
                    <button type="submit" class="px-5 py-2 bg-indigo-600 text-white rounded-xl font-medium text-sm hover:bg-indigo-700 transition shadow-sm">Save Contact</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Contact Details Modal -->
    <div id="detailsModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-md rounded-2xl shadow-xl overflow-hidden transform transition-all">
            <div class="bg-gradient-to-r from-indigo-500 to-indigo-600 px-6 py-6 text-white relative">
                <button onclick="closeDetailsModal()" class="absolute top-4 right-4 text-white/80 hover:text-white p-1 rounded-lg transition">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
                <div class="flex items-center gap-4">
                    <div id="detailAvatar" class="w-16 h-16 rounded-full bg-white/20 flex items-center justify-center text-2xl font-bold uppercase tracking-wider">
                        JD
                    </div>
                    <div>
                        <h3 id="detailName" class="text-xl font-bold">Jane Doe</h3>
                        <span id="detailCategory" class="inline-block mt-1 px-2.5 py-0.5 rounded-full text-xs font-medium bg-white/20">Personal</span>
                    </div>
                </div>
            </div>
            <div class="p-6 flex flex-col gap-4 text-sm">
                <div class="flex items-center gap-3 p-3 rounded-xl bg-slate-50 border border-slate-100">
                    <div class="w-10 h-10 rounded-xl bg-indigo-50 text-indigo-600 flex items-center justify-center text-lg">
                        <i class="fa-solid fa-phone"></i>
                    </div>
                    <div class="flex-grow">
                        <span class="block text-xs font-medium text-slate-400">Phone Number</span>
                        <a id="detailPhoneLink" href="#" class="font-semibold text-slate-800 hover:text-indigo-600 transition">+1 (555) 019-2834</a>
                    </div>
                </div>
                <div class="flex justify-end gap-3 mt-4 pt-4 border-t border-slate-100">
                    <button onclick="editFromDetails()" class="px-4 py-2 rounded-xl border border-indigo-200 text-indigo-600 font-medium text-sm hover:bg-indigo-50 transition flex items-center gap-2">
                        <i class="fa-solid fa-pen"></i> Edit
                    </button>
                    <button onclick="deleteFromDetails()" class="px-4 py-2 rounded-xl bg-rose-50 text-rose-600 font-medium text-sm hover:bg-rose-100 transition flex items-center gap-2">
                        <i class="fa-solid fa-trash"></i> Delete
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Custom Confirmation Dialog Modal -->
    <div id="confirmModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-sm rounded-2xl shadow-xl overflow-hidden p-6 text-center flex flex-col items-center">
            <div class="w-12 h-12 rounded-full bg-rose-50 text-rose-600 flex items-center justify-center text-xl mb-4">
                <i class="fa-solid fa-triangle-exclamation"></i>
            </div>
            <h3 id="confirmTitle" class="font-bold text-lg text-slate-800 mb-2">Delete Contact</h3>
            <p id="confirmMessage" class="text-sm text-slate-500 mb-6">Are you sure you want to delete this contact? This action cannot be undone.</p>
            <div class="flex gap-3 w-full">
                <button onclick="closeConfirmModal()" class="flex-1 py-2.5 rounded-xl border border-slate-200 text-slate-600 font-medium text-sm hover:bg-slate-50 transition">Cancel</button>
                <button id="confirmActionBtn" class="flex-1 py-2.5 rounded-xl bg-rose-600 text-white font-medium text-sm hover:bg-rose-700 transition shadow-sm">Delete</button>
            </div>
        </div>
    </div>

    <script>
        // Application State
        let contacts = [];
        let currentView = 'list';
        let currentActiveId = null;
        let confirmCallback = null;

        // Sample starter data if storage is empty
        const defaultContacts = [
            { id: '1', name: 'Alice Smith', phone: '+1 (555) 234-5678', category: 'Work' },
            { id: '2', name: 'Bob Johnson', phone: '+1 (555) 876-5432', category: 'Personal' },
            { id: '3', name: 'Catherine Zeta', phone: '+1 (555) 345-6789', category: 'Family' }
        ];

        // Initialize App on Load
        window.addEventListener('DOMContentLoaded', () => {
            loadContacts();
            renderContacts();
        });

        // Load and Save to LocalStorage
        function loadContacts() {
            try {
                const stored = localStorage.getItem('phonebook_contacts');
                if (stored) {
                    contacts = JSON.parse(stored);
                } else {
                    contacts = defaultContacts;
                    saveContacts();
                }
            } catch (e) {
                console.error("Error loading contacts", e);
                contacts = defaultContacts;
            }
        }

        function saveContacts() {
            try {
                localStorage.setItem('phonebook_contacts', JSON.stringify(contacts));
            } catch (e) {
                console.error("Error saving contacts", e);
                showToast("Failed to save changes to storage.", "error");
            }
        }

        // Toast Notification System
        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            const msgEl = document.getElementById('toast-message');
            const iconEl = document.getElementById('toast-icon');

            msgEl.textContent = message;
            if (type === 'success') {
                toast.className = "fixed top-20 right-4 z-50 px-4 py-3 rounded-xl shadow-lg text-white font-medium text-sm transition-all transform duration-300 bg-emerald-600 flex items-center gap-3";
                iconEl.innerHTML = '<i class="fa-solid fa-circle-check"></i>';
            } else {
                toast.className = "fixed top-20 right-4 z-50 px-4 py-3 rounded-xl shadow-lg text-white font-medium text-sm transition-all transform duration-300 bg-rose-600 flex items-center gap-3";
                iconEl.innerHTML = '<i class="fa-solid fa-circle-exclamation"></i>';
            }

            toast.classList.remove('hidden');
            setTimeout(() => {
                toast.classList.add('hidden');
            }, 3000);
        }

        // View Mode Switcher
        function setViewMode(mode) {
            currentView = mode;
            const listBtn = document.getElementById('listViewBtn');
            const gridBtn = document.getElementById('gridViewBtn');

            if (mode === 'list') {
                listBtn.className = "px-3 py-1.5 rounded-lg text-xs font-semibold bg-white text-indigo-600 shadow-sm transition";
                gridBtn.className = "px-3 py-1.5 rounded-lg text-xs font-semibold text-slate-500 hover:text-slate-800 transition";
            } else {
                gridBtn.className = "px-3 py-1.5 rounded-lg text-xs font-semibold bg-white text-indigo-600 shadow-sm transition";
                listBtn.className = "px-3 py-1.5 rounded-lg text-xs font-semibold text-slate-500 hover:text-slate-800 transition";
            }
            renderContacts();
        }

        // Search Filter Handler
        function handleSearch() {
            renderContacts();
        }

        // Render Contacts function
        function renderContacts() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            const container = document.getElementById('contactContainer');
            
            const filtered = contacts.filter(c => 
                c.name.toLowerCase().includes(query) || c.phone.toLowerCase().includes(query)
            );

            // Sort alphabetically by name
            filtered.sort((a, b) => a.name.localeCompare(b.name));

            document.getElementById('contactCount').textContent = `${filtered.length} contact${filtered.length === 1 ? '' : 's'} found`;

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="bg-white rounded-2xl p-12 text-center border border-slate-100 shadow-sm flex flex-col items-center justify-center gap-3 mt-4">
                        <div class="w-16 h-16 bg-indigo-50 text-indigo-500 rounded-full flex items-center justify-center text-2xl">
                            <i class="fa-solid fa-address-book"></i>
                        </div>
                        <h3 class="font-bold text-slate-700 text-lg">No contacts found</h3>
                        <p class="text-sm text-slate-400 max-w-sm">We couldn't find any contacts matching your search or your phone book is currently empty.</p>
                        <button onclick="openAddModal()" class="mt-2 px-4 py-2 bg-indigo-600 text-white font-medium text-xs rounded-xl shadow-sm hover:bg-indigo-700 transition">
                            Add Contact Now
                        </button>
                    </div>
                `;
                return;
            }

            if (currentView === 'list') {
                let html = '<div class="bg-white rounded-2xl border border-slate-100 shadow-sm overflow-hidden divide-y divide-slate-100">';
                filtered.forEach(contact => {
                    const initials = getInitials(contact.name);
                    const badgeColor = getCategoryColor(contact.category);
                    html += `
                        <div class="p-4 flex items-center justify-between hover:bg-slate-50/80 transition cursor-pointer gap-4" onclick="openDetailsModal('${contact.id}')">
                            <div class="flex items-center gap-3.5 min-w-0">
                                <div class="w-11 h-11 rounded-full bg-indigo-100 text-indigo-700 font-semibold flex items-center justify-center text-sm uppercase shrink-0">
                                    ${initials}
                                </div>
                                <div class="min-w-0">
                                    <div class="flex items-center gap-2">
                                        <h4 class="font-semibold text-slate-800 text-sm truncate">${escapeHtml(contact.name)}</h4>
                                        <span class="px-2 py-0.5 text-[10px] font-semibold rounded-full ${badgeColor}">${escapeHtml(contact.category || 'General')}</span>
                                    </div>
                                    <p class="text-xs text-slate-500 flex items-center gap-1.5 mt-0.5 truncate">
                                        <i class="fa-solid fa-phone text-[10px] text-slate-400"></i> ${escapeHtml(contact.phone)}
                                    </p>
                                </div>
                            </div>
                            <div class="flex items-center gap-1 shrink-0" onclick="event.stopPropagation()">
                                <button onclick="openEditModal('${contact.id}')" class="p-2 text-slate-400 hover:text-indigo-600 rounded-lg hover:bg-indigo-50 transition" title="Edit">
                                    <i class="fa-solid fa-pen text-xs"></i>
                                </button>
                                <button onclick="confirmDelete('${contact.id}')" class="p-2 text-slate-400 hover:text-rose-600 rounded-lg hover:bg-rose-50 transition" title="Delete">
                                    <i class="fa-solid fa-trash text-xs"></i>
                                </button>
                            </div>
                        </div>
                    `;
                });
                html += '</div>';
                container.innerHTML = html;
            } else {
                let html = '<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">';
                filtered.forEach(contact => {
                    const initials = getInitials(contact.name);
                    const badgeColor = getCategoryColor(contact.category);
                    html += `
                        <div class="bg-white rounded-2xl border border-slate-100 shadow-sm p-5 flex flex-col justify-between hover:shadow-md transition cursor-pointer relative group" onclick="openDetailsModal('${contact.id}')">
                            <div>
                                <div class="flex justify-between items-start mb-3">
                                    <div class="w-12 h-12 rounded-full bg-indigo-100 text-indigo-700 font-bold flex items-center justify-center text-base uppercase">
                                        ${initials}
                                    </div>
                                    <span class="px-2.5 py-0.5 text-[10px] font-semibold rounded-full ${badgeColor}">${escapeHtml(contact.category || 'General')}</span>
                                </div>
                                <h4 class="font-bold text-slate-800 text-base mb-1 truncate">${escapeHtml(contact.name)}</h4>
                                <p class="text-xs text-slate-600 flex items-center gap-2 mb-1">
                                    <i class="fa-solid fa-phone text-slate-400 w-3"></i> ${escapeHtml(contact.phone)}
                                </p>
                            </div>
                            <div class="flex justify-end gap-1 mt-4 pt-3 border-t border-slate-100" onclick="event.stopPropagation()">
                                <button onclick="openEditModal('${contact.id}')" class="px-3 py-1.5 text-xs font-medium text-indigo-600 hover:bg-indigo-50 rounded-lg transition flex items-center gap-1.5">
                                    <i class="fa-solid fa-pen"></i> Edit
                                </button>
                                <button onclick="confirmDelete('${contact.id}')" class="px-3 py-1.5 text-xs font-medium text-rose-600 hover:bg-rose-50 rounded-lg transition flex items-center gap-1.5">
                                    <i class="fa-solid fa-trash"></i> Delete
                                </button>
                            </div>
                        </div>
                    `;
                });
                html += '</div>';
                container.innerHTML = html;
            }
        }

        // Helper functions for UI styling & utility
        function getInitials(name) {
            if (!name) return '??';
            const parts = name.trim().split(' ');
            if (parts.length >= 2) {
                return (parts[0][0] + parts[1][0]).toUpperCase();
            }
            return name.substring(0, 2).toUpperCase();
        }

        function getCategoryColor(cat) {
            switch(cat) {
                case 'Work': return 'bg-blue-50 text-blue-700';
                case 'Family': return 'bg-purple-50 text-purple-700';
                case 'Friends': return 'bg-amber-50 text-amber-700';
                case 'Personal': return 'bg-emerald-50 text-emerald-700';
                default: return 'bg-slate-100 text-slate-700';
            }
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        // Modal Operations (Add / Edit)
        function openAddModal() {
            document.getElementById('modalTitle').textContent = 'Add Contact';
            document.getElementById('contactForm').reset();
            document.getElementById('contactId').value = '';
            document.getElementById('contactModal').classList.remove('hidden');
        }

        function openEditModal(id) {
            const contact = contacts.find(c => c.id === id);
            if (!contact) return;

            document.getElementById('modalTitle').textContent = 'Edit Contact';
            document.getElementById('contactId').value = contact.id;
            document.getElementById('nameInput').value = contact.name;
            document.getElementById('phoneInput').value = contact.phone;
            document.getElementById('categoryInput').value = contact.category || 'Personal';

            document.getElementById('contactModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('contactModal').classList.add('hidden');
        }

        // Form Submit Handler & Data Validation
        function handleFormSubmit(e) {
            e.preventDefault();
            const id = document.getElementById('contactId').value;
            const name = document.getElementById('nameInput').value.trim();
            const phone = document.getElementById('phoneInput').value.trim();
            const category = document.getElementById('categoryInput').value;

            // 1. Validation: Prevent empty names
            if (!name) {
                showToast("Contact name cannot be empty.", "error");
                return;
            }

            // 2. Validation: Prevent empty phone
            if (!phone) {
                showToast("Phone number cannot be empty.", "error");
                return;
            }

            // 3. Validation: Duplicate contact check (Same phone number or exact same name & phone)
            const duplicate = contacts.find(c => c.phone.trim().toLowerCase() === phone.toLowerCase() && c.id !== id);
            if (duplicate) {
                showToast(`A contact with phone number "${phone}" already exists (${duplicate.name}).`, "error");
                return;
            }

            if (id) {
                // Update existing
                const index = contacts.findIndex(c => c.id === id);
                if (index !== -1) {
                    contacts[index] = { id, name, phone, category };
                    showToast("Contact updated successfully!", "success");
                }
            } else {
                // Add new
                const newContact = {
                    id: Date.now().toString(),
                    name,
                    phone,
                    category
                };
                contacts.push(newContact);
                showToast("Contact added successfully!", "success");
            }

            saveContacts();
            closeModal();
            renderContacts();
        }

        // Contact Details Modal Operations
        function openDetailsModal(id) {
            const contact = contacts.find(c => c.id === id);
            if (!contact) return;

            currentActiveId = id;
            document.getElementById('detailAvatar').textContent = getInitials(contact.name);
            document.getElementById('detailName').textContent = contact.name;
            document.getElementById('detailCategory').textContent = contact.category || 'General';
            
            const phoneLink = document.getElementById('detailPhoneLink');
            phoneLink.textContent = contact.phone;
            phoneLink.href = `tel:${contact.phone}`;

            document.getElementById('detailsModal').classList.remove('hidden');
        }

        function closeDetailsModal() {
            document.getElementById('detailsModal').classList.add('hidden');
            currentActiveId = null;
        }

        function editFromDetails() {
            const id = currentActiveId;
            closeDetailsModal();
            openEditModal(id);
        }

        function deleteFromDetails() {
            const id = currentActiveId;
            closeDetailsModal();
            confirmDelete(id);
        }

        // Custom Confirmation Dialog
        function confirmDelete(id) {
            const contact = contacts.find(c => c.id === id);
            if (!contact) return;

            document.getElementById('confirmTitle').textContent = 'Delete Contact';
            document.getElementById('confirmMessage').textContent = `Are you sure you want to delete "${contact.name}"? This action cannot be undone.`;
            
            const actionBtn = document.getElementById('confirmActionBtn');
            actionBtn.onclick = function() {
                deleteContact(id);
                closeConfirmModal();
            };

            document.getElementById('confirmModal').classList.remove('hidden');
        }

        function closeConfirmModal() {
            document.getElementById('confirmModal').classList.add('hidden');
        }

        function deleteContact(id) {
            contacts = contacts.filter(c => c.id !== id);
            saveContacts();
            renderContacts();
            showToast("Contact deleted successfully.", "success");
        }
    </script>
</body>
</html>
