<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChromaTask - Modern Colorful To-Do List</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Inter & Outfit -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        heading: ['Outfit', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        h1, h2, h3, h4, .font-heading { font-family: 'Outfit', sans-serif; }
    </style>
</head>
<body class="bg-gradient-to-br from-indigo-50 via-purple-50 to-pink-50 min-h-screen text-slate-800">
    <div id="root"></div>

    <script type="text/babel">
        // ==========================================
        // FIREBASE CONFIGURATION & INITIALIZATION
        // ==========================================
        const firebaseConfig = {
            apiKey: "AIzaSyC2-v2XoAQuviwFZs76sZtaZ-cRubxI72U",
            authDomain: "todolist-1050f.firebaseapp.com",
            projectId: "todolist-1050f",
            storageBucket: "todolist-1050f.firebasestorage.app",
            messagingSenderId: "557403496760",
            appId: "1:557403496760:web:627da5da5aaf46c24b21cd"
        };

        let db = null;
        let auth = null;
        let isFirebaseInitialized = false;

        try {
            if (firebaseConfig.apiKey) {
                if (!firebase.apps.length) {
                    firebase.initializeApp(firebaseConfig);
                }
                db = firebase.firestore();
                auth = firebase.auth();
                isFirebaseInitialized = true;
            }
        } catch (e) {
            console.warn("Firebase initialization failed.", e);
        }

        const { useState, useEffect, useMemo } = React;

        const CATEGORIES = [
            { name: 'Work', color: 'bg-blue-500 text-white', border: 'border-blue-500', light: 'bg-blue-50 text-blue-700' },
            { name: 'Personal', color: 'bg-emerald-500 text-white', border: 'border-emerald-500', light: 'bg-emerald-50 text-emerald-700' },
            { name: 'Shopping', color: 'bg-amber-500 text-white', border: 'border-amber-500', light: 'bg-amber-50 text-amber-700' },
            { name: 'Important', color: 'bg-rose-500 text-white', border: 'border-rose-500', light: 'bg-rose-50 text-rose-700' },
        ];

        const PRIORITIES = [
            { name: 'High', color: 'bg-rose-100 text-rose-700 border-rose-300' },
            { name: 'Medium', color: 'bg-amber-100 text-amber-700 border-amber-300' },
            { name: 'Low', color: 'bg-emerald-100 text-emerald-700 border-emerald-300' },
        ];

        function App() {
            const [user, setUser] = useState(null);
            const [authLoading, setAuthLoading] = useState(true);
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [isSignUp, setIsSignUp] = useState(false);
            
            const [tasks, setTasks] = useState([]);
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState(null);
            const [successMsg, setSuccessMsg] = useState(null);

            const [activeTab, setActiveTab] = useState('all');
            const [selectedCategory, setSelectedCategory] = useState('All');
            const [searchQuery, setSearchQuery] = useState('');
            const [priorityFilter, setPriorityFilter] = useState('All');

            const [isModalOpen, setIsModalOpen] = useState(false);
            const [editingTask, setEditingTask] = useState(null);
            const [deleteModalId, setDeleteModalId] = useState(null);

            const [formData, setFormData] = useState({
                title: '',
                description: '',
                category: 'Work',
                priority: 'Medium',
                dueDate: new Date().toISOString().split('T')[0]
            });

            useEffect(() => {
                if (isFirebaseInitialized && auth) {
                    const unsubscribe = auth.onAuthStateChanged((currentUser) => {
                        setUser(currentUser);
                        setAuthLoading(false);
                    });
                    return () => unsubscribe();
                } else {
                    setUser({ uid: 'local-demo-user', email: 'demouser@chromatask.app' });
                    setAuthLoading(false);
                }
            }, []);

            useEffect(() => {
                if (!user) return;

                if (isFirebaseInitialized && db) {
                    setLoading(true);
                    const unsubscribe = db.collection('artifacts')
                        .doc('chromatask')
                        .collection('users')
                        .doc(user.uid)
                        .collection('tasks')
                        .orderBy('createdAt', 'desc')
                        .onSnapshot((snapshot) => {
                            const loadedTasks = snapshot.docs.map(doc => ({
                                id: doc.id,
                                ...doc.data()
                            }));
                            setTasks(loadedTasks);
                            setLoading(false);
                        }, (err) => {
                            console.error("Firestore error:", err);
                            setError("Failed to load tasks from Firestore.");
                            setLoading(false);
                        });

                    return () => unsubscribe();
                } else {
                    const saved = localStorage.getItem(`chromatask_${user.uid}`);
                    if (saved) {
                        try { setTasks(JSON.parse(saved)); } catch (e) { console.error(e); }
                    }
                    setLoading(false);
                }
            }, [user]);

            const persistLocalTasks = (newTasks) => {
                setTasks(newTasks);
                if (user && (!isFirebaseInitialized || !db)) {
                    localStorage.setItem(`chromatask_${user.uid}`, JSON.stringify(newTasks));
                }
            };

            const handleAuth = async (e) => {
                e.preventDefault();
                setError(null);
                try {
                    if (isSignUp) {
                        await auth.createUserWithEmailAndPassword(email, password);
                        showSuccess("Account created successfully!");
                    } else {
                        await auth.signInWithEmailAndPassword(email, password);
                        showSuccess("Welcome back!");
                    }
                } catch (err) {
                    setError(err.message);
                }
            };

            const handleLogout = async () => {
                if (isFirebaseInitialized && auth) {
                    await auth.signOut();
                } else {
                    setUser(null);
                }
            };

            const showSuccess = (msg) => {
                setSuccessMsg(msg);
                setTimeout(() => setSuccessMsg(null), 3500);
            };

            const handleSaveTask = async (e) => {
                e.preventDefault();
                if (!formData.title.trim()) return;

                const now = new Date().toISOString();
                const taskData = {
                    title: formData.title,
                    description: formData.description,
                    category: formData.category,
                    priority: formData.priority,
                    dueDate: formData.dueDate,
                    completed: editingTask ? editingTask.completed : false,
                    updatedAt: now,
                };

                try {
                    if (isFirebaseInitialized && db && user) {
                        const tasksRef = db.collection('artifacts').doc('chromatask').collection('users').doc(user.uid).collection('tasks');
                        if (editingTask) {
                            await tasksRef.doc(editingTask.id).update(taskData);
                            showSuccess("Task updated successfully!");
                        } else {
                            await tasksRef.add({ ...taskData, createdAt: now });
                            showSuccess("Task created successfully!");
                        }
                    } else {
                        if (editingTask) {
                            const updated = tasks.map(t => t.id === editingTask.id ? { ...t, ...taskData } : t);
                            persistLocalTasks(updated);
                            showSuccess("Task updated successfully!");
                        } else {
                            const newTask = { id: 'task_' + Date.now(), ...taskData, createdAt: now };
                            persistLocalTasks([newTask, ...tasks]);
                            showSuccess("Task created successfully!");
                        }
                    }
                    closeModal();
                } catch (err) {
                    console.error(err);
                    setError("Failed to save task.");
                }
            };

            const toggleComplete = async (task) => {
                const updatedStatus = !task.completed;
                const now = new Date().toISOString();
                try {
                    if (isFirebaseInitialized && db && user) {
                        await db.collection('artifacts').doc('chromatask').collection('users').doc(user.uid)
                            .collection('tasks').doc(task.id).update({ completed: updatedStatus, updatedAt: now });
                    } else {
                        const updated = tasks.map(t => t.id === task.id ? { ...t, completed: updatedStatus, updatedAt: now } : t);
                        persistLocalTasks(updated);
                    }
                } catch (err) {
                    setError("Failed to update status.");
                }
            };

            const confirmDelete = async () => {
                if (!deleteModalId) return;
                try {
                    if (isFirebaseInitialized && db && user) {
                        await db.collection('artifacts').doc('chromatask').collection('users').doc(user.uid)
                            .collection('tasks').doc(deleteModalId).delete();
                        showSuccess("Task deleted.");
                    } else {
                        const updated = tasks.filter(t => t.id !== deleteModalId);
                        persistLocalTasks(updated);
                        showSuccess("Task deleted.");
                    }
                    setDeleteModalId(null);
                } catch (err) {
                    setError("Failed to delete task.");
                }
            };

            const openModal = (task = null) => {
                if (task) {
                    setEditingTask(task);
                    setFormData({
                        title: task.title,
                        description: task.description || '',
                        category: task.category || 'Work',
                        priority: task.priority || 'Medium',
                        dueDate: task.dueDate || new Date().toISOString().split('T')[0]
                    });
                } else {
                    setEditingTask(null);
                    setFormData({
                        title: '',
                        description: '',
                        category: 'Work',
                        priority: 'Medium',
                        dueDate: new Date().toISOString().split('T')[0]
                    });
                }
                setIsModalOpen(true);
            };

            const closeModal = () => {
                setIsModalOpen(false);
                setEditingTask(null);
            };

            const filteredTasks = useMemo(() => {
                const todayStr = new Date().toISOString().split('T')[0];
                return tasks.filter(task => {
                    if (searchQuery && !task.title.toLowerCase().includes(searchQuery.toLowerCase()) && !(task.description || '').toLowerCase().includes(searchQuery.toLowerCase())) {
                        return false;
                    }
                    if (priorityFilter !== 'All' && task.priority !== priorityFilter) {
                        return false;
                    }
                    if (activeTab === 'today') return task.dueDate === todayStr;
                    if (activeTab === 'upcoming') return task.dueDate > todayStr;
                    if (activeTab === 'completed') return task.completed;
                    if (activeTab === 'category') return task.category === selectedCategory;
                    return true;
                });
            }, [tasks, activeTab, selectedCategory, searchQuery, priorityFilter]);

            const stats = useMemo(() => {
                const total = tasks.length;
                const completed = tasks.filter(t => t.completed).length;
                const pending = total - completed;
                const todayStr = new Date().toISOString().split('T')[0];
                const todayCount = tasks.filter(t => t.dueDate === todayStr && !t.completed).length;
                return { total, completed, pending, todayCount };
            }, [tasks]);

            if (authLoading) {
                return (
                    <div className="flex items-center justify-center min-h-screen">
                        <div className="animate-spin rounded-full h-12 w-12 border-b-2 border-indigo-600"></div>
                    </div>
                );
            }

            if (!user) {
                return (
                    <div className="flex items-center justify-center min-h-screen p-4">
                        <div className="bg-white/90 backdrop-blur-md rounded-3xl shadow-2xl border border-white/40 p-8 max-w-md w-full">
                            <div className="text-center mb-8">
                                <div className="bg-gradient-to-tr from-indigo-600 to-purple-600 text-white w-16 h-16 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg shadow-indigo-500/30 text-2xl font-bold">
                                    <i className="fa-solid fa-check-double"></i>
                                </div>
                                <h1 className="text-3xl font-bold font-heading text-slate-900">ChromaTask</h1>
                                <p className="text-slate-500 mt-1">Your colorful workspace for daily productivity</p>
                            </div>

                            {error && (
                                <div className="bg-rose-50 border border-rose-200 text-rose-700 px-4 py-3 rounded-xl mb-6 text-sm flex items-center gap-3">
                                    <i className="fa-solid fa-circle-exclamation text-lg"></i>
                                    <span>{error}</span>
                                </div>
                            )}

                            <form onSubmit={handleAuth} className="space-y-4">
                                <div>
                                    <label className="block text-sm font-medium text-slate-700 mb-1">Email Address</label>
                                    <input 
                                        type="email" 
                                        required
                                        value={email}
                                        onChange={(e) => setEmail(e.target.value)}
                                        className="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 outline-none"
                                        placeholder="you@example.com"
                                    />
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-slate-700 mb-1">Password</label>
                                    <input 
                                        type="password" 
                                        required
                                        value={password}
                                        onChange={(e) => setPassword(e.target.value)}
                                        className="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 outline-none"
                                        placeholder="••••••••"
                                    />
                                </div>

                                <button type="submit" className="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-xl shadow-lg shadow-indigo-600/30 transition">
                                    {isSignUp ? 'Create Account' : 'Sign In'}
                                </button>
                            </form>

                            <div className="mt-6 text-center">
                                <button onClick={() => setIsSignUp(!isSignUp)} className="text-sm text-indigo-600 hover:underline font-medium">
                                    {isSignUp ? 'Already have an account? Sign In' : "Don't have an account? Sign Up"}
                                </button>
                            </div>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen flex flex-col md:flex-row">
                    {successMsg && (
                        <div className="fixed bottom-5 right-5 z-50 bg-emerald-600 text-white px-6 py-3 rounded-2xl shadow-xl flex items-center gap-3 animate-bounce">
                            <i className="fa-solid fa-circle-check"></i>
                            <span className="font-medium">{successMsg}</span>
                        </div>
                    )}

                    <aside className="w-full md:w-72 bg-white/80 backdrop-blur-md border-r border-slate-200 p-6 flex flex-col justify-between shrink-0">
                        <div>
                            <div className="flex items-center gap-3 mb-8">
                                <div className="bg-gradient-to-tr from-indigo-600 to-purple-600 text-white w-10 h-10 rounded-xl flex items-center justify-center shadow-md shadow-indigo-500/30 text-lg font-bold">
                                    <i className="fa-solid fa-check-double"></i>
                                </div>
                                <span className="text-2xl font-bold font-heading text-slate-900">ChromaTask</span>
                            </div>

                            <nav className="space-y-1.5">
                                <button onClick={() => setActiveTab('all')} className={`w-full flex items-center justify-between px-4 py-3 rounded-xl font-medium transition ${activeTab === 'all' ? 'bg-indigo-600 text-white shadow-lg' : 'text-slate-600 hover:bg-slate-100'}`}>
                                    <div className="flex items-center gap-3"><i className="fa-solid fa-list-check w-5"></i> All Tasks</div>
                                    <span className={`text-xs px-2 py-0.5 rounded-full ${activeTab === 'all' ? 'bg-white/20 text-white' : 'bg-slate-200 text-slate-700'}`}>{stats.total}</span>
                                </button>
                                <button onClick={() => setActiveTab('today')} className={`w-full flex items-center justify-between px-4 py-3 rounded-xl font-medium transition ${activeTab === 'today' ? 'bg-indigo-600 text-white shadow-lg' : 'text-slate-600 hover:bg-slate-100'}`}>
                                    <div className="flex items-center gap-3"><i className="fa-solid fa-calendar-day w-5"></i> Today</div>
                                    <span className={`text-xs px-2 py-0.5 rounded-full ${activeTab === 'today' ? 'bg-white/20 text-white' : 'bg-slate-200 text-slate-700'}`}>{stats.todayCount}</span>
                                </button>
                                <button onClick={() => setActiveTab('upcoming')} className={`w-full flex items-center justify-between px-4 py-3 rounded-xl font-medium transition ${activeTab === 'upcoming' ? 'bg-indigo-600 text-white shadow-lg' : 'text-slate-600 hover:bg-slate-100'}`}>
                                    <div className="flex items-center gap-3"><i className="fa-solid fa-calendar-week w-5"></i> Upcoming</div>
                                </button>
                                <button onClick={() => setActiveTab('completed')} className={`w-full flex items-center justify-between px-4 py-3 rounded-xl font-medium transition ${activeTab === 'completed' ? 'bg-indigo-600 text-white shadow-lg' : 'text-slate-600 hover:bg-slate-100'}`}>
                                    <div className="flex items-center gap-3"><i className="fa-solid fa-circle-check w-5"></i> Completed</div>
                                    <span className={`text-xs px-2 py-0.5 rounded-full ${activeTab === 'completed' ? 'bg-white/20 text-white' : 'bg-slate-200 text-slate-700'}`}>{stats.completed}</span>
                                </button>
                            </nav>

                            <div className="mt-8">
                                <p className="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-3 px-3">Categories</p>
                                <div className="space-y-1">
                                    {CATEGORIES.map(cat => (
                                        <button key={cat.name} onClick={() => { setActiveTab('category'); setSelectedCategory(cat.name); }} className={`w-full flex items-center justify-between px-3 py-2 rounded-lg text-sm font-medium transition ${activeTab === 'category' && selectedCategory === cat.name ? 'bg-slate-200 text-slate-900 font-semibold' : 'text-slate-600 hover:bg-slate-100'}`}>
                                            <div className="flex items-center gap-2.5">
                                                <span className={`w-3 h-3 rounded-full ${cat.color.split(' ')[0]}`}></span>
                                                {cat.name}
                                            </div>
                                            <span className="text-xs text-slate-400">{tasks.filter(t => t.category === cat.name).length}</span>
                                        </button>
                                    ))}
                                </div>
                            </div>
                        </div>

                        <div className="pt-6 border-t border-slate-200 mt-6">
                            <div className="truncate text-xs text-slate-500 font-medium mb-3 px-2">{user.email}</div>
                            <button onClick={handleLogout} className="w-full flex items-center justify-center gap-2 px-4 py-2.5 bg-rose-50 text-rose-600 hover:bg-rose-100 font-medium rounded-xl transition text-sm">
                                <i className="fa-solid fa-right-from-bracket"></i> Sign Out
                            </button>
                        </div>
                    </aside>

                    <main className="flex-1 p-6 md:p-10 overflow-y-auto">
                        <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-8">
                            <div>
                                <h1 className="text-3xl font-bold font-heading text-slate-900">
                                    {activeTab === 'all' && 'All Tasks'}
                                    {activeTab === 'today' && "Today's Tasks"}
                                    {activeTab === 'upcoming' && 'Upcoming Tasks'}
                                    {activeTab === 'completed' && 'Completed Tasks'}
                                    {activeTab === 'category' && `${selectedCategory} Tasks`}
                                </h1>
                                <p className="text-slate-500 mt-1">Manage your schedule and stay organized</p>
                            </div>
                            <button onClick={() => openModal()} className="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold px-6 py-3 rounded-2xl shadow-xl shadow-indigo-600/30 flex items-center gap-2.5 transition">
                                <i className="fa-solid fa-plus text-lg"></i> Add New Task
                            </button>
                        </div>

                        <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
                            <div className="bg-white/80 backdrop-blur-md p-5 rounded-2xl border border-slate-200 shadow-sm flex items-center gap-4">
                                <div className="w-12 h-12 rounded-2xl bg-indigo-50 text-indigo-600 flex items-center justify-center text-xl font-bold">
                                    <i className="fa-solid fa-layer-group"></i>
                                </div>
                                <div>
                                    <p className="text-xs font-semibold text-slate-400 uppercase">Total Tasks</p>
                                    <h3 className="text-2xl font-bold font-heading text-slate-900">{stats.total}</h3>
                                </div>
                            </div>
                            <div className="bg-white/80 backdrop-blur-md p-5 rounded-2xl border border-slate-200 shadow-sm flex items-center gap-4">
                                <div className="w-12 h-12 rounded-2xl bg-amber-50 text-amber-600 flex items-center justify-center text-xl font-bold">
                                    <i className="fa-solid fa-clock"></i>
                                </div>
                                <div>
                                    <p className="text-xs font-semibold text-slate-400 uppercase">Pending</p>
                                    <h3 className="text-2xl font-bold font-heading text-slate-900">{stats.pending}</h3>
                                </div>
                            </div>
                            <div className="bg-white/80 backdrop-blur-md p-5 rounded-2xl border border-slate-200 shadow-sm flex items-center gap-4">
                                <div className="w-12 h-12 rounded-2xl bg-emerald-50 text-emerald-600 flex items-center justify-center text-xl font-bold">
                                    <i className="fa-solid fa-circle-check"></i>
                                </div>
                                <div>
                                    <p className="text-xs font-semibold text-slate-400 uppercase">Completed</p>
                                    <h3 className="text-2xl font-bold font-heading text-slate-900">{stats.completed}</h3>
                                </div>
                            </div>
                            <div className="bg-white/80 backdrop-blur-md p-5 rounded-2xl border border-slate-200 shadow-sm flex items-center gap-4">
                                <div className="w-12 h-12 rounded-2xl bg-rose-50 text-rose-600 flex items-center justify-center text-xl font-bold">
                                    <i className="fa-solid fa-fire"></i>
                                </div>
                                <div>
                                    <p className="text-xs font-semibold text-slate-400 uppercase">Due Today</p>
                                    <h3 className="text-2xl font-bold font-heading text-slate-900">{stats.todayCount}</h3>
                                </div>
                            </div>
                        </div>

                        <div className="bg-white/80 backdrop-blur-md p-4 rounded-2xl border border-slate-200 shadow-sm mb-6 flex flex-col md:flex-row gap-4 items-center justify-between">
                            <div className="relative w-full md:w-80">
                                <i className="fa-solid fa-magnifying-glass absolute left-4 top-3.5 text-slate-400"></i>
                                <input 
                                    type="text" 
                                    placeholder="Search tasks..." 
                                    value={searchQuery}
                                    onChange={(e) => setSearchQuery(e.target.value)}
                                    className="w-full pl-11 pr-4 py-2.5 rounded-xl border border-slate-200 outline-none text-sm"
                                />
                            </div>
                            <select 
                                value={priorityFilter}
                                onChange={(e) => setPriorityFilter(e.target.value)}
                                className="px-4 py-2.5 rounded-xl border border-slate-200 text-sm bg-white w-full md:w-auto"
                            >
                                <option value="All">All Priorities</option>
                                <option value="High">High Priority</option>
                                <option value="Medium">Medium Priority</option>
                                <option value="Low">Low Priority</option>
                            </select>
                        </div>

                        {loading ? (
                            <div className="text-center py-16">
                                <div className="animate-spin rounded-full h-10 w-10 border-b-2 border-indigo-600 mx-auto"></div>
                                <p className="text-slate-500 mt-3 text-sm">Syncing tasks...</p>
                            </div>
                        ) : filteredTasks.length === 0 ? (
                            <div className="text-center py-20 bg-white/50 rounded-3xl border border-dashed border-slate-300">
                                <div className="w-16 h-16 bg-indigo-50 text-indigo-500 rounded-2xl flex items-center justify-center mx-auto mb-4 text-2xl">
                                    <i className="fa-solid fa-clipboard-list"></i>
                                </div>
                                <h3 className="text-lg font-bold text-slate-800">No tasks found</h3>
                                <p className="text-slate-500 text-sm mt-1">Get started by creating a new task.</p>
                            </div>
                        ) : (
                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
                                {filteredTasks.map(task => {
                                    const catObj = CATEGORIES.find(c => c.name === task.category) || CATEGORIES[0];
                                    const prioObj = PRIORITIES.find(p => p.name === task.priority) || PRIORITIES[1];
                                    return (
                                        <div key={task.id} className={`bg-white/90 backdrop-blur-md p-6 rounded-3xl border border-slate-200 shadow-sm hover:shadow-xl transition flex flex-col justify-between ${task.completed ? 'opacity-60 bg-slate-50' : ''}`}>
                                            <div>
                                                <div className="flex items-center justify-between mb-3">
                                                    <span className={`text-xs font-semibold px-3 py-1 rounded-full ${catObj.light}`}>{task.category}</span>
                                                    <span className={`text-xs font-semibold px-2.5 py-1 rounded-lg border ${prioObj.color}`}>{task.priority}</span>
                                                </div>
                                                <h3 className={`text-lg font-bold font-heading text-slate-900 mb-2 ${task.completed ? 'line-through text-slate-400' : ''}`}>{task.title}</h3>
                                                {task.description && <p className="text-slate-600 text-sm mb-4 line-clamp-2">{task.description}</p>}
                                            </div>
                                            <div className="pt-4 border-t border-slate-100 flex items-center justify-between mt-4">
                                                <div className="flex items-center gap-2 text-xs text-slate-400">
                                                    <i className="fa-regular fa-calendar"></i>
                                                    <span>{task.dueDate}</span>
                                                </div>
                                                <div className="flex items-center gap-2">
                                                    <button onClick={() => toggleComplete(task)} className={`w-8 h-8 rounded-xl flex items-center justify-center transition ${task.completed ? 'bg-emerald-500 text-white' : 'bg-slate-100 text-slate-500 hover:bg-emerald-100 hover:text-emerald-600'}`}>
                                                        <i className="fa-solid fa-check text-sm"></i>
                                                    </button>
                                                    <button onClick={() => openModal(task)} className="w-8 h-8 rounded-xl bg-slate-100 text-slate-500 hover:bg-indigo-100 hover:text-indigo-600 flex items-center justify-center transition">
                                                        <i className="fa-solid fa-pen text-xs"></i>
                                                    </button>
                                                    <button onClick={() => setDeleteModalId(task.id)} className="w-8 h-8 rounded-xl bg-slate-100 text-slate-500 hover:bg-rose-100 hover:text-rose-600 flex items-center justify-center transition">
                                                        <i className="fa-solid fa-trash text-xs"></i>
                                                    </button>
                                                </div>
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        )}
                    </main>

                    {isModalOpen && (
                        <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="bg-white rounded-3xl shadow-2xl max-w-lg w-full p-8 border border-slate-100">
                                <div className="flex items-center justify-between mb-6">
                                    <h2 className="text-2xl font-bold font-heading text-slate-900">{editingTask ? 'Edit Task' : 'Create New Task'}</h2>
                                    <button onClick={closeModal} className="text-slate-400 hover:text-slate-600"><i className="fa-solid fa-xmark text-xl"></i></button>
                                </div>
                                <form onSubmit={handleSaveTask} className="space-y-4">
                                    <div>
                                        <label className="block text-sm font-medium text-slate-700 mb-1">Task Title</label>
                                        <input type="text" required value={formData.title} onChange={(e) => setFormData({...formData, title: e.target.value})} className="w-full px-4 py-3 rounded-xl border border-slate-200 outline-none text-sm" placeholder="What needs to be done?" />
                                    </div>
                                    <div>
                                        <label className="block text-sm font-medium text-slate-700 mb-1">Description (Optional)</label>
                                        <textarea rows="3" value={formData.description} onChange={(e) => setFormData({...formData, description: e.target.value})} className="w-full px-4 py-3 rounded-xl border border-slate-200 outline-none text-sm" placeholder="Add details..."></textarea>
                                    </div>
                                    <div className="grid grid-cols-2 gap-4">
                                        <div>
                                            <label className="block text-sm font-medium text-slate-700 mb-1">Category</label>
                                            <select value={formData.category} onChange={(e) => setFormData({...formData, category: e.target.value})} className="w-full px-4 py-3 rounded-xl border border-slate-200 text-sm bg-white">
                                                {CATEGORIES.map(c => <option key={c.name} value={c.name}>{c.name}</option>)}
                                            </select>
                                        </div>
                                        <div>
                                            <label className="block text-sm font-medium text-slate-700 mb-1">Priority</label>
                                            <select value={formData.priority} onChange={(e) => setFormData({...formData, priority: e.target.value})} className="w-full px-4 py-3 rounded-xl border border-slate-200 text-sm bg-white">
                                                <option value="High">High</option>
                                                <option value="Medium">Medium</option>
                                                <option value="Low">Low</option>
                                            </select>
                                        </div>
                                    </div>
                                    <div>
                                        <label className="block text-sm font-medium text-slate-700 mb-1">Due Date</label>
                                        <input type="date" value={formData.dueDate} onChange={(e) => setFormData({...formData, dueDate: e.target.value})} className="w-full px-4 py-3 rounded-xl border border-slate-200 text-sm" />
                                    </div>
                                    <div className="flex items-center justify-end gap-3 pt-4 border-t border-slate-100">
                                        <button type="button" onClick={closeModal} className="px-5 py-2.5 rounded-xl border border-slate-200 text-slate-600 font-medium text-sm">Cancel</button>
                                        <button type="submit" className="px-6 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-sm shadow-lg">{editingTask ? 'Save Changes' : 'Create Task'}</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {deleteModalId && (
                        <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="bg-white rounded-3xl shadow-2xl max-w-sm w-full p-6 text-center">
                                <div className="w-14 h-14 bg-rose-50 text-rose-600 rounded-2xl flex items-center justify-center mx-auto mb-4 text-2xl">
                                    <i className="fa-solid fa-triangle-exclamation"></i>
                                </div>
                                <h3 className="text-xl font-bold font-heading text-slate-900 mb-2">Delete Task</h3>
                                <p className="text-slate-500 text-sm mb-6">Are you sure you want to delete this task?</p>
                                <div className="flex gap-3">
                                    <button onClick={() => setDeleteModalId(null)} className="flex-1 py-2.5 rounded-xl border border-slate-200 text-slate-600 font-medium text-sm">Cancel</button>
                                    <button onClick={confirmDelete} className="flex-1 py-2.5 rounded-xl bg-rose-600 hover:bg-rose-700 text-white font-semibold text-sm shadow-lg">Delete</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
